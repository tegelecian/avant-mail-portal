# Render blueprint. Starter instance + 1 GB persistent disk: the portal stays
# awake and its SQLite database + uploaded flyers survive restarts/redeploys.
# (Graph credentials + TEST_SEND_REAL are set in the Render dashboard, not here.)
services:
  - type: web
    name: avant-mail-portal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # 1 worker only — each worker process starts its own sender thread, so more
    # would double-send campaigns. 16 threads so a few stalled slow uploads
    # can't occupy every request slot and freeze the site (happened 2026-08-20).
    startCommand: gunicorn app:app --workers 1 --threads 16 --bind 0.0.0.0:$PORT
    disk:
      name: portal-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: TZ
        value: America/Los_Angeles # scheduling + timestamps in Pacific, not UTC
      - key: FLASK_SECRET
        generateValue: true # stable across restarts so logins survive them
      - key: DRY_RUN
        value: "true"
      # Flip to "true" (and add TENANT_ID / CLIENT_ID / CLIENT_SECRET in the
      # Render dashboard) to make "Send yourself a test" deliver real email
      # while campaigns stay simulated.
      - key: TEST_SEND_REAL
        value: "false"
      - key: PORTAL_PASSWORD
        sync: false # you type the demo password once, in the Render dashboard
      # Also settable in the dashboard (optional): PORTAL_USERS for individual
      # logins per person (format in .env.example) and SECRET_EXPIRES=YYYY-MM-DD
      # to get a banner before the Azure client secret lapses.
      - key: SENDER_EMAIL
        value: dberdin@avantrealestate.com
      - key: SENDER_NAME
        value: Denise Berdin
      - key: RATE_PER_MINUTE
        value: "20"
      - key: DAILY_SEND_CAP
        value: "8000"
