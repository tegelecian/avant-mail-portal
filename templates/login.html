<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Avant Mail Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <div class="brand-mark big">AVANT</div>
    <div class="brand-sub">Mail portal</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% if users %}
    <label for="who">Who's signing in?</label>
    <select id="who" name="who" class="select">
      {# names only — this page is public, don't hand mailboxes to bots #}
      {% for u in users %}<option value="{{ u.name }}">{{ u.name }}</option>{% endfor %}
    </select>
    <label for="password">Your password</label>
    {% else %}
    <label for="password">Team password</label>
    {% endif %}
    <input id="password" name="password" type="password" autofocus autocomplete="current-password">
    <button type="submit" class="btn primary wide">Sign in</button>
  </form>
</body>
</html>
